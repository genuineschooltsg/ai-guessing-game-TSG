<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Guessing Game: Guess My Favorite Things!</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .header p {
      color: var(--subtext-color);
      font-size: 0.95rem;
    }

    .progress-bar {
      height: 8px;
      background-color: #334155;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 20%;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .clue-box {
      background-color: #0f172a;
      border-left: 4px solid var(--accent-color);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .clue-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .clue-text {
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      background-color: #334155;
      border: 2px solid transparent;
      color: var(--text-color);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #475569;
      border-color: var(--accent-color);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .option-btn.correct {
      background-color: var(--correct);
      color: #ffffff;
    }

    .option-btn.wrong {
      background-color: var(--wrong);
      color: #ffffff;
    }

    .next-btn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      transition: background-color 0.2s ease;
    }

    .next-btn:hover {
      background-color: var(--accent-hover);
    }

    .results-screen {
      text-align: center;
      display: none;
    }

    .results-screen h2 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .results-screen p {
      color: var(--subtext-color);
      margin-bottom: 24px;
      font-size: 1.1rem;
    }

    .restart-btn {
      padding: 14px 28px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .restart-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="quiz-screen">
      <div class="header">
        <h1>AI Guessing Game</h1>
        <p>Study the clues and guess my choices!</p>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>

      <div class="clue-box">
        <div class="clue-title">Abstract Clue</div>
        <div class="clue-text" id="clue">Loading clue...</div>
      </div>

      <div class="question-text" id="question">Loading question...</div>

      <div class="options-grid" id="options"></div>

      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="results-screen" id="results-screen">
      <h2>Game Complete!</h2>
      <p id="score-text">You scored 0 out of 5!</p>
      <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
    </div>
  </div>

  <script>
    const quizData = [
      {
        clue: "Glowing pixels, digital landscapes, and immersive virtual worlds.",
        question: "What is one of my favorite digital pastimes?",
        options: ["Reading Books", "Playing Videogames", "Cooking", "Board Games"],
        answer: 1
      },
      {
        clue: "An orange sphere bouncing on hardwood, aiming for a high net.",
        question: "What is my favorite sport to play?",
        options: ["Basketball", "Swimming", "Soccer", "Tennis"],
        answer: 0
      },
      {
        clue: "Dim lighting, a large theater screen, glowing projections, and cinematic stories.",
        question: "What is another favorite hobby of mine?",
        options: ["Painting", "Watching Movies", "Gardening", "Camping"],
        answer: 1
      },
      {
        clue: "A quiet, independent creature with whiskers that purrs when patted.",
        question: "What is my absolute favorite animal?",
        options: ["Dog", "Hamster", "Cat", "Parrot"],
        answer: 2
      },
      {
        clue: "Combining high scores in games, fast breaks on the court, movie nights, and a purring pet.",
        question: "Which combo represents my ideal weekend?",
        options: [
          "Running laps, swimming, and eating salad",
          "Gaming, watching a movie, playing basketball, and petting my cat",
          "Studying, sleeping, and going shopping",
          "Hiking in the mountains with a dog"
        ],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const clueEl = document.getElementById('clue');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const quizScreen = document.getElementById('quiz-screen');
    const resultsScreen = document.getElementById('results-screen');
    const scoreText = document.getElementById('score-text');

    function loadQuestion() {
      const q = quizData[currentQuestion];
      clueEl.textContent = q.clue;
      questionEl.textContent = q.question;
      optionsEl.innerHTML = '';
      nextBtn.style.display = 'none';

      progressEl.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.textContent = option;
        btn.onclick = () => selectOption(index);
        optionsEl.appendChild(btn);
      });
    }

    function selectOption(index) {
      const q = quizData[currentQuestion];
      const buttons = optionsEl.querySelectorAll('.option-btn');

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) {
          btn.classList.add('correct');
        } else if (i === index) {
          btn.classList.add('wrong');
        }
      });

      if (index === q.answer) {
        score++;
      }

      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizScreen.style.display = 'none';
      resultsScreen.style.display = 'block';
      scoreText.textContent = `You scored ${score} out of ${quizData.length}!`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      resultsScreen.style.display = 'none';
      quizScreen.style.display = 'block';
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
